name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source commit
        required: true
        type: string
      publish:
        description: Publish after verification succeeds
        default: false
        type: boolean

concurrency:
  group: verified-web-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    if: github.repository == 'xuniv/AssppWeb'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the reviewed source revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          case "$EXPECTED_SHA" in *[!0-9a-f]*|'') exit 1;; esac
          test "${#EXPECTED_SHA}" = 40
          if [ "$PUBLISH" = true ]; then test "$GITHUB_REF" = refs/heads/main; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run format:check
      - run: npm test && npm run build
        working-directory: backend
      - run: npm test && npx tsc --noEmit && npm run build
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ipatool/sap
          key: public-apple-macos27-26A434-arm64-v5
      - name: Build the client Store interpreter and public assets
        run: bash runtime/build.sh frontend/public/store-runtime
      - name: Check isolated shared code and translated-code invalidation
        run: node runtime/tests/code-invalidation.mjs
      - name: Check native asset decoding memory
        run: node runtime/tests/memory.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Check the actual interpreter in both browser engines
        env:
          BROWSERS: chromium,webkit
        run: node runtime/tests/browser.mjs frontend/public/store-runtime
      - name: Check verified Apple TLS and SAP through the actual Wisp server
        env:
          BROWSERS: chromium,webkit
          LIVE_APPLE: '1'
          PROVISION_APPLE: '1'
        run: node runtime/tests/browser.mjs frontend/public/store-runtime
      - name: Check server-mode consent and cancellation in WebKit
        run: node --import ./backend/node_modules/tsx/dist/loader.mjs runtime/tests/server-mode-webkit.mjs

  build:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
