name: Verify and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character main commit
        required: true
        type: string
      publish:
        description: Publish after verification succeeds
        default: false
        type: boolean

concurrency:
  group: verified-web-image
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'xuniv/AssppWeb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      image: ${{ steps.source.outputs.image }}
      created: ${{ steps.source.outputs.created }}
    steps:
      - name: Require the reviewed source revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          case "$EXPECTED_SHA" in *[!0-9a-f]*|'') exit 1;; esac
          test "${#EXPECTED_SHA}" = 40
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin reviewed main and image metadata
        id: source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run format:check
      - run: npm test && npm run build
        working-directory: backend
      - run: npm test && npx tsc --noEmit && npm run build
        working-directory: frontend

  build:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Require a native build runner
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native architecture by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.verify.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ needs.verify.outputs.created }}
          build-args: |
            BUILD_COMMIT=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ needs.verify.outputs.created }}
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,scope=native-${{ matrix.arch }},mode=min

      - name: Export only the architecture digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/image-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/image-digests/$ARCH.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Require reviewed main before publishing tags
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SHA) || data.commit.sha !== process.env.EXPECTED_SHA) {
              core.setFailed('Reviewed main changed; publication blocked.');
            }
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish one manifest after both native builds
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/image-digests/$arch.digest")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          test "${sources[0]}" != "${sources[1]}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE:${SOURCE_SHA:0:7}" \
            --tag "$IMAGE:latest" \
            "${sources[@]}"
      - name: Delete the tiny temporary digest artifacts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            for (const artifact of artifacts) {
              if (['image-digest-amd64', 'image-digest-arm64'].includes(artifact.name)) {
                await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
              }
            }
