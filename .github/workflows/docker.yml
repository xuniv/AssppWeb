name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  # Lets the workflow be started by hand from the Actions tab, so an image can
  # be rebuilt without pushing a commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ipatool/sap
          key: public-apple-macos27-26A434-arm64-v5
      - name: Build the client Store interpreter and public assets
        run: bash runtime/build.sh frontend/public/store-runtime
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Check the actual interpreter in both browser engines
        env:
          BROWSERS: chromium,webkit
        run: node runtime/tests/browser.mjs frontend/public/store-runtime
      - run: npm run format:check
      - run: npm test && npm run build
        working-directory: backend
      - run: npm test && npx tsc --noEmit && npm run build
        working-directory: frontend

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
